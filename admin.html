<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PPE Management Portal</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .header {
      background: #0f172a;
      color: white;
      padding: 22px 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }

    .tab-button {
      border: none;
      background: #e5e7eb;
      color: #374151;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .tab-button:hover {
      background: #d1d5db;
    }

    .tab-button.active {
      background: #0f172a;
      color: white;
    }

    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    .iframe-container {
      width: 100%;
      min-height: 1200px;
      background: white;
    }

    .iframe-container iframe {
      width: 100%;
      min-height: 1200px;
      border: none;
      display: block;
      background: white;
    }

    .coming-soon {
      margin: 30px;
      padding: 30px;
      background: white;
      border-radius: 10px;
      text-align: center;
      color: #64748b;
    }

  </style>

</head>

<body>

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <div class="header">

    <h1>
      🛡 PPE Management Portal
    </h1>

    <p>
      PPE Inventory, Stock Receipt and Issuance Management
    </p>

  </div>


  <!-- ========================= -->
  <!-- TABS -->
  <!-- ========================= -->

  <div class="tabs">

    <button
      class="tab-button active"
      onclick="openTab('inventory', this)"
    >
      📊 Inventory Dashboard
    </button>

    <button
      class="tab-button"
      onclick="openTab('receipt', this)"
    >
      📥 Stock Receipt
    </button>

    <button
      class="tab-button"
      onclick="openTab('issuance', this)"
    >
      📤 PPE Issuance
    </button>

  </div>


  <!-- ========================= -->
  <!-- INVENTORY DASHBOARD -->
  <!-- ========================= -->

  <div
    id="inventory"
    class="tab-content active"
  >

    <div class="iframe-container">

      <iframe
        src="InventoryDashboardContent.html"
        title="Inventory Dashboard"
      ></iframe>

    </div>

  </div>


<!-- ========================= -->
<!-- STOCK RECEIPT -->
<!-- ========================= -->

<div
  id="receipt"
  class="tab-content"
>

  <div class="iframe-container">

    <iframe
      src="StockReceiptContent.html"
      title="Stock Receipt"
    ></iframe>

  </div>

</div>


  <!-- ========================= -->
  <!-- PPE ISSUANCE -->
  <!-- ========================= -->

  <div
    id="issuance"
    class="tab-content"
  >

    <div class="coming-soon">

      📤 PPE Issuance

      <br><br>

      PPE Issuance module will be connected
      to the PPE backend next.

    </div>

  </div>


  <!-- ========================= -->
  <!-- TAB FUNCTION -->
  <!-- ========================= -->

  <script>

    function openTab(tabId, button) {

      /*
       * HIDE ALL TABS
       */

      const contents =
        document.querySelectorAll(
          '.tab-content'
        );

      contents.forEach(
        function(content) {

          content.classList.remove(
            'active'
          );

        }
      );


      /*
       * REMOVE ACTIVE BUTTONS
       */

      const buttons =
        document.querySelectorAll(
          '.tab-button'
        );

      buttons.forEach(
        function(btn) {

          btn.classList.remove(
            'active'
          );

        }
      );


      /*
       * SHOW SELECTED TAB
       */

      const selectedTab =
        document.getElementById(
          tabId
        );

      if (selectedTab) {

        selectedTab.classList.add(
          'active'
        );

      }


      /*
       * ACTIVATE BUTTON
       */

      if (button) {

        button.classList.add(
          'active'
        );

      }

    }

  </script>

</body>
</html>
